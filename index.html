<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Anthe Shop &amp; bisutería - Pulseras y accesorios hechos a mano." />
  <title>Anthe Shop</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/estilos.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body data-pagina="inicio">

  <div id="navbar"></div>

  <!-- Carrusel: las fotos y los links los crea scripts.js -->
  <header>
    <div id="miCarrusel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="5000">
      <div class="carousel-indicators"></div>
      <div class="carousel-inner"></div>

      <button class="carousel-control-prev" type="button" data-bs-target="#miCarrusel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#miCarrusel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </header>

  <!-- Productos destacados: los crea scripts.js -->
  <main>
    <section class="pt-4 pb-5">
      <div class="container px-4 px-lg-5">
        <div id="destacados" class="row g-3 g-lg-4 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center"></div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/scripts.js"></script>
  <!-- whatsapp flotante-->
  <a href="https://wa.me/56986671499" class="btn-whatsapp-flotante" target="_blank" rel="noopener" aria-label="Contacto WhatsApp">
  <i class="bi bi-whatsapp"></i>
</a>
</body>
</html>
