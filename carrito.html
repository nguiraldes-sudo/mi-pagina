<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Carrito de compras - Anthe Shop &amp; bisutería" />
  <title>Carrito | Anthe Shop</title>
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
  <link href="css/estilos.css" rel="stylesheet" />
</head>
<body data-pagina="carrito">

  <div id="navbar"></div>

  <header class="bg-marca text-white text-center py-4">
    <div class="container px-4 px-lg-5">
      <h1 class="display-6 fw-bolder">Tu carrito de compras</h1>
      <p class="lead fw-normal text-white-50 mb-0">Revisa tus productos antes de finalizar la compra</p>
    </div>
  </header>

  <!-- La tabla la llena scripts.js -->
  <main>
    <section class="py-5">
      <div class="container px-4 px-lg-5">
        <div class="row">

          <div class="col-lg-8 mb-4">
            <div class="table-responsive">
              <table class="table align-middle">
                <thead class="table-dark">
                  <tr>
                    <th scope="col">Producto</th>
                    <th scope="col">Precio</th>
                    <th scope="col">Cantidad</th>
                    <th scope="col">Subtotal</th>
                    <th scope="col"><span class="visually-hidden">Quitar</span></th>
                  </tr>
                </thead>
                <tbody id="lista-carrito"></tbody>
              </table>
            </div>
            <div class="d-flex justify-content-between mt-3">
              <a href="productos.html" class="btn btn-outline-secondary">
                <i class="bi-arrow-left me-1"></i> Seguir comprando
              </a>
              <button id="vaciar-carrito" class="btn btn-outline-danger" type="button">
                <i class="bi-trash me-1"></i> Vaciar carrito
              </button>
            </div>
          </div>

          <div class="col-lg-4">
            <div class="card">
              <div class="card-body p-4">
                <h5 class="card-title fw-bolder mb-3">Resumen de la compra</h5>
                <hr />
                <div class="d-flex justify-content-between mb-2">
                  <span>Subtotal</span>
                  <span id="resumen-subtotal">$0</span>
                </div>
                <div class="d-flex justify-content-between mb-2">
                  <span>Envío</span>
                  <span class="text-muted">Por calcular</span>
                </div>
                <hr />
                <div class="d-flex justify-content-between mb-4">
                  <strong class="fs-5">Total</strong>
                  <strong class="fs-5" id="resumen-total">$0</strong>
                </div>
                <button class="btn btn-dark w-100 py-2" type="button" id="btn-checkout">Proceder al pago</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/scripts.js"></script>
  <a href="https://wa.me/569XXXXXXXX" class="btn-whatsapp-flotante" target="_blank" rel="noopener" aria-label="Contacto WhatsApp">
  <i class="bi bi-whatsapp"></i>
</a>

</body>
</html>
